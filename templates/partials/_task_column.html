{% load crispy_forms_tags %}

<div class="row">
  <div class="d-flex flex-column align-items-stretch flex-shrink-0 ms-0 p-0 outline" style="width: 320px;">

    <ol class="ps-0" style="list-style-position: inside;">

    {% for task in object.tasks.all %}

      <button class="accordian-button" type="radio" data-bs-toggle="collapse" data-bs-target="#collapseTask{{ task.pk }}" style="width: 320px;" aria-expanded="false" aria-controls="collapseTaskBar">
        <div class="card-body">
          <li style="text-align: left;">
            {{ task.task_name }}
          </li>
        </div>
      </button>
    
    {% endfor %}

      <div class="card card-body fixed-bottom" style="width: 300px;">
        <div class="btn-toolbar align-items-center justify-content-between">
          <button class="btn btn-secondary" type="submit" style="width: min-content;">
            SAVE
          </button>
          <button class="btn btn-success" type="submit" style="width: min-content;">
            SUBMIT
          </button>
        </div>
      </div>

    </ol>

  </div>

  <div class="d-flex flex-column p-0" style="width: 300px;">

  {% for task in object.tasks.all %}
    <div class="collapse collapse-horizontal" id="collapseTask{{ task.pk }}">

      <div class="card card-body" style="width: 300px;">
        <p class="card-text">
          {{ task.description }}
        </p>
        <form action="#" method="post">
          {% csrf_token %}
          <label for="task{{ task.pk }}Input" class="form-label">
            Flag:
          </label>
          <input type="text" class="form-control mb-2" id="task{{ task.pk }}Input">
          <button class="btn btn-success" type="#" value="Check">
            Check
          </button>
        </form>

      </div>

    </div>
  {% endfor %}

    </div>

  </div>


</div>
